<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>医大のロゴを学ぼう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#6E6E6E;
    --line:#E1E1E1;
    --accent:#111111;
    --accent-tint:#F0F0F0;
    --correct:#2F6E4E;
    --correct-bg:#E9F3EC;
    --wrong:#A63B32;
    --wrong-bg:#FBEDEB;
    --tap-bg:#F2F2F2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans JP", sans-serif;
    background: var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .material-icons{ font-size:20px; line-height:1; user-select:none; }

  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- APP HEADER (persistent) ---------- */
  .app-header{
    position:sticky; top:0; z-index:30;
    display:flex;
    align-items:center;
    padding:16px 18px;
    background:#fff;
  }
  .app-header-title{
    font-family:"WDXL Lubrifont JP N", sans-serif;
    font-weight:400;
    font-size:22px;
    letter-spacing:.01em;
    color:#0067AD;
  }
  .back-icon{
    width:0; opacity:0; overflow:hidden;
    margin-right:0;
    background:transparent; border:none; padding:0;
    display:flex; align-items:center; justify-content:center;
    color:#0067AD; cursor:pointer;
    transition: width .28s ease, opacity .22s ease, margin-right .28s ease;
    flex-shrink:0;
  }
  .app-header.show-back .back-icon{
    width:24px; opacity:1; margin-right:6px;
  }
  .back-icon .material-icons{ font-size:26px; }
  .icon-btn{
    width:36px; height:36px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; color:var(--ink);
  }
  .icon-btn:active{ background:var(--tap-bg); }

  .screen{ display:none; flex-direction:column; flex:1; padding:20px 18px 28px; }
  .screen.active{ display:flex; }

  /* ---------- HOME ---------- */
  #home{ gap:0; }
  .mosaic-wrap{
    margin: 4px -18px 24px;
    overflow:hidden;
  }
  .mosaic-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:4px;
    width:114%;
    margin-left:-7%;
  }
  .mosaic-cell{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#fff;
    border:1px solid #EDEDED;
  }
  .mosaic-inner{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    will-change:transform;
    background:#fff; padding:10%;
  }
  .mosaic-inner img{ width:100%; height:100%; object-fit:contain; }
  .home-desc{
    font-size:14px; line-height:1.8; color:var(--ink-soft);
    margin:2px 0 24px; text-align:left;
  }

  .cat-label{
    font-size:12px; color:var(--ink-soft); font-weight:600; margin:0 0 10px 2px;
  }
  .cat-tabs{
    display:flex; flex-direction:column; gap:8px; margin-bottom:18px;
  }
  .cat-tab-row{ display:flex; gap:8px; }
  .cat-tab-row .cat-tab{ flex:1 1 0; min-width:0; }
  .cat-tab{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px;
    padding:10px 4px 9px;
    border-radius:8px;
    border:1px solid #000;
    background:#fff;
    color:#000;
    cursor:pointer;
  }
  .cat-tab-all{ width:100%; padding:11px 4px; }
  .cat-tab-all .cat-tab-kanji{ font-size:19px; }
  .cat-tab-all .cat-tab-label{ font-size:12px; }
  .cat-tab-kanji{
    font-family:"WDXL Lubrifont JP N", sans-serif;
    font-size:22px;
    line-height:1;
    color:#0067AD;
  }
  .cat-tab-label{
    font-family:"Noto Sans JP", sans-serif;
    font-weight:600;
    font-size:10.5px;
    color:inherit;
  }
  .cat-tab.active{
    border-color:#000;
    background:#000;
    color:#fff;
  }
  .cat-tab.active .cat-tab-kanji{ color:#fff; }
  .cat-count{
    font-size:12.5px; color:var(--ink-soft); margin-bottom:24px;
  }
  .cat-count b{ color:var(--ink); font-weight:700; }

  .slider-block{ margin-bottom:28px; }
  .slider-label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--ink-soft); font-weight:600; margin-bottom:10px;
  }
  .slider-label b{ font-size:20px; color:var(--ink); font-weight:800; margin:0 2px; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px; border-radius:99px;
    background:var(--line); outline:none; margin:0;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:#fff; border:3px solid var(--ink); cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:#fff; border:3px solid var(--ink); cursor:pointer;
  }

  .home-actions{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }

  .btn-primary{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:#fff; border:none;
    font-family:"Noto Sans JP", sans-serif; font-weight:700; font-size:16px;
    padding:16px 20px; border-radius:8px; cursor:pointer;
  }
  .btn-secondary{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:#fff; color:var(--ink); border:1.5px solid var(--accent);
    font-family:"Noto Sans JP", sans-serif; font-weight:700; font-size:16px;
    padding:14.5px 20px; border-radius:8px; cursor:pointer;
  }
  .btn-ghost{
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:var(--ink); border:1.5px solid var(--ink);
    font-family:"Noto Sans JP", sans-serif; font-weight:600; font-size:14.5px;
    padding:13px 20px; border-radius:8px; cursor:pointer; margin-top:12px;
  }

  /* ---------- SHARED TOPBAR (in-screen, e.g. study) ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .topbar-title{ font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:16px; color:var(--ink); }

  /* ---------- QUIZ ---------- */
  #quiz{ gap:0; }
  .quiz-topbar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; padding:0 2px;
  }
  .quiz-topbar .prog{ font-weight:600; letter-spacing:.03em; }
  .quiz-topbar .score{ font-weight:600; color:var(--ink); }
  .progress-track{
    height:4px; background:var(--line); border-radius:99px; margin-bottom:20px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }

  .logo-card{
    background:#FFFFFF;
    padding:26px 20px;
    display:flex; align-items:center; justify-content:center;
    height:200px;
    margin-bottom:18px;
  }
  .logo-card img{ max-width:100%; max-height:150px; object-fit:contain; }

  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-wrap input{
    width:100%; padding:10px 8px 10px 30px; font-size:14.5px;
    border:none; border-bottom:2px solid var(--ink); border-radius:0; background:transparent;
    font-family:"Noto Sans JP", sans-serif; color:var(--ink);
    outline:none;
  }
  .search-wrap .icon{
    position:absolute; left:2px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); display:flex;
  }

  .choice-list{
    flex:1;
    overflow-y:auto;
    max-height:280px;
  }
  .choice-item{
    display:block; width:100%; text-align:left;
    padding:13px 4px; font-size:14.5px; font-family:"Noto Sans JP", sans-serif;
    background:none; border:none; border-bottom:1px solid #000;
    color:var(--ink); cursor:pointer;
  }
  .choice-item:active{ background:var(--tap-bg); }
  .choice-empty{ padding:24px 4px; text-align:center; color:var(--ink-soft); font-size:13.5px; }

  /* ---------- FEEDBACK ---------- */
  .feedback-badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:99px; font-weight:700; font-size:14.5px;
    margin-bottom:14px; width:fit-content;
  }
  .feedback-badge.correct{ background:var(--correct-bg); color:var(--correct); }
  .feedback-badge.wrong{ background:var(--wrong-bg); color:var(--wrong); }

  .feedback-answer{
    font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:19px;
    color:var(--ink); margin:0 0 4px;
  }
  .feedback-loc{
    font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;
    display:flex; align-items:center; gap:4px;
  }
  .feedback-loc .material-icons{ font-size:15px; }
  .feedback-your-answer{
    font-size:13px; color:var(--wrong); margin:0 0 14px;
  }

  .origin-box{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:16px 16px; margin-bottom:18px; flex:1; overflow-y:auto;
  }
  .origin-box .label{
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px;
  }
  .origin-box p{
    font-size:14px; line-height:1.9; color:var(--ink); margin:0;
  }

  /* ---------- RESULT ---------- */
  #result{ justify-content:center; text-align:center; }
  .result-eyebrow{
    font-size:12px; letter-spacing:.14em; color:var(--ink-soft);
    margin-bottom:10px; font-weight:700; text-align:center;
  }
  .result-score{
    font-family:"Noto Sans JP", sans-serif; font-weight:900; font-size:56px;
    color:var(--ink); line-height:1; margin:6px 0 4px;
  }
  .result-score span{ font-size:22px; font-weight:600; color:var(--ink-soft); }
  .result-label{ font-size:14px; color:var(--ink-soft); margin-bottom:26px; }
  .result-comment{
    font-size:15px; line-height:1.8; color:var(--ink); margin:0 auto 30px; max-width:320px;
  }

  /* ---------- STUDY GRID ---------- */
  #study{ gap:0; }
  .study-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    overflow-y:auto;
    padding-bottom:10px;
  }
  .study-card{
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:14px 10px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
  }
  .study-card:active{ background:var(--tap-bg); }
  .study-card img{ width:100%; height:64px; object-fit:contain; }
  .study-card .sc-name{
    font-size:12px; text-align:center; line-height:1.45; color:var(--ink);
    font-weight:500;
  }
  .study-empty{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 0; }

  /* ---------- REVERSE MODE ---------- */
  .rev-name-card{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    min-height:140px; padding:26px 20px; margin-bottom:18px;
    font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:21px;
    color:var(--ink); line-height:1.5;
  }

  /* ---------- PREFECTURE MAP QUIZ ---------- */
  .pref-map-wrap{ display:flex; align-items:center; justify-content:center; margin-bottom:12px; }
  .pref-map-wrap svg{ width:100%; height:auto; max-height:100%; }
  .pref-map-wrap .prefecture{ cursor:pointer; transition:fill .15s ease; }
  .pref-map-wrap.answered .prefecture{ cursor:default; pointer-events:none; }
  .pref-map-wrap .prefecture.pq-correct{ fill:#2F6E4E !important; }
  .pref-map-wrap .prefecture.pq-wrong{ fill:#A63B32 !important; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,0.5);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.active{ display:flex; }
  .modal-sheet{
    width:100%; max-width:460px; background:#fff;
    border-radius:16px 16px 0 0;
    padding:22px 20px 26px;
    max-height:82vh; overflow-y:auto;
    position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:16px;
  }
  .modal-logo{
    display:flex; align-items:center; justify-content:center;
    height:140px; margin-bottom:16px;
  }
  .modal-logo img{ max-width:100%; max-height:120px; object-fit:contain; }
  .modal-name{
    font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:19px;
    color:var(--ink); margin:0 0 2px; text-align:center;
  }
  .modal-cat{
    text-align:center; font-size:11.5px; color:var(--ink-soft); font-weight:600;
    letter-spacing:.06em; margin-bottom:16px;
  }
  .modal-origin-label{
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px;
  }
  .modal-origin p{ font-size:14px; line-height:1.9; color:var(--ink); margin:0; }
</style>
</head>
<body>
<div id="app">

  <div class="app-header" id="appHeader">
    <button class="back-icon" id="headerHomeBtn"><span class="material-icons">chevron_left</span></button>
    <span class="app-header-title">医大のロゴを学ぼう</span>
  </div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="mosaic-wrap"><div class="mosaic-grid" id="mosaicGrid"></div></div>
    <p class="home-desc">全82校の校章を学びましょう！</p>

    <div class="cat-label">対象を選ぶ</div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="cat-count" id="catCount"></div>

    <div class="slider-block">
      <div class="slider-label">出題数　<span><b id="qCountVal">10</b>問</span></div>
      <input type="range" id="qCountSlider" min="1" max="82" value="10">
    </div>

    <div class="home-actions">
      <button class="btn-primary" id="startBtn">クイズに挑戦する</button>
      <button class="btn-secondary" id="studyBtn">ロゴを学習する</button>
      <button class="btn-secondary" id="reverseBtn">名前からロゴを当てる</button>
      <button class="btn-secondary" id="prefBtn">都道府県を当てる</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen">
    <div class="quiz-topbar">
      <span class="prog" id="progText">問題 1 / 82</span>
      <span class="score" id="scoreText">正解 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

    <div class="logo-card" id="logoCard">
      <img id="logoImg" src="" alt="ロゴ">
    </div>

    <div id="answeringPane">
      <div class="search-wrap">
        <span class="icon material-icons">search</span>
        <input type="text" id="searchInput" placeholder="大学名・ひらがなで検索...">
      </div>
      <div class="choice-list" id="choiceList"></div>
    </div>

    <div id="feedbackPane" style="display:none; flex:1; flex-direction:column;">
      <div class="feedback-badge" id="feedbackBadge"></div>
      <p class="feedback-answer" id="feedbackAnswer"></p>
      <p class="feedback-loc" id="feedbackLoc"><span class="material-icons">place</span><span id="feedbackLocText"></span></p>
      <p class="feedback-your-answer" id="feedbackYourAnswer"></p>
      <div class="origin-box">
        <div class="label">校章・ロゴの由来</div>
        <p id="originText"></p>
      </div>
      <button class="btn-primary" id="nextBtn">次の問題へ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="result-eyebrow">RESULT</div>
    <div class="result-score" id="resultScore">0<span>/82</span></div>
    <div class="result-label">正解</div>
    <p class="result-comment" id="resultComment"></p>
    <button class="btn-primary" id="retryBtn">もう一度挑戦する</button>
    <button class="btn-ghost" id="homeBtn">ホームに戻る</button>
  </section>

  <!-- STUDY -->
  <section id="study" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="studyBackBtn"><span class="material-icons">arrow_back</span></button>
      <span class="topbar-title" id="studyTitle">学習：すべて</span>
    </div>
    <div class="search-wrap">
      <span class="icon material-icons">search</span>
      <input type="text" id="studySearch" placeholder="大学名・ひらがなで検索...">
    </div>
    <div style="height:12px;"></div>
    <div class="study-grid" id="studyGrid"></div>
  </section>

  <!-- REVERSE (name -> logo, no scoring) -->
  <section id="reverse" class="screen">
    <div class="quiz-topbar">
      <span class="prog" id="revProgText">1 / 10</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="revProgFill" style="width:0%"></div></div>

    <div id="revCardPane" style="flex:1; display:flex; flex-direction:column;">
      <div class="rev-name-card" id="revNameCard"></div>
      <div class="logo-card" id="revLogoCard" style="display:none;">
        <img id="revLogoImg" src="" alt="ロゴ">
      </div>
      <p class="feedback-loc" id="revLoc" style="display:none; justify-content:center;"><span class="material-icons">place</span><span id="revLocText"></span></p>
      <div class="origin-box" id="revOriginBox" style="display:none;">
        <div class="label">校章・ロゴの由来</div>
        <p id="revOriginText"></p>
      </div>
      <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
        <button class="btn-primary" id="revRevealBtn">ロゴを表示する</button>
        <button class="btn-primary" id="revNextBtn" style="display:none;">次へ</button>
      </div>
    </div>

    <div id="revDonePane" style="display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
      <p style="font-family:'Noto Sans JP',sans-serif; font-weight:800; font-size:19px; margin-bottom:10px;">おつかれさまでした</p>
      <p style="font-size:14px; color:var(--ink-soft); margin-bottom:26px;">選んだ範囲のロゴを見終わりました。</p>
      <button class="btn-primary" id="revRetryBtn" style="margin-bottom:10px;">もう一度見る</button>
      <button class="btn-ghost" id="revHomeBtn">ホームに戻る</button>
    </div>
  </section>

  <!-- PREFECTURE QUIZ (logo -> tap prefecture) -->
  <section id="prefquiz" class="screen">
    <div class="quiz-topbar">
      <span class="prog" id="pqProgText">問題 1 / 10</span>
      <span class="score" id="pqScoreText">正解 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="pqProgFill" style="width:0%"></div></div>

    <div class="logo-card" id="pqLogoCard" style="height:130px; margin-bottom:10px;">
      <img id="pqLogoImg" src="" alt="ロゴ">
    </div>
    <p style="text-align:center; font-size:12.5px; color:var(--ink-soft); margin:0 0 10px;">この大学がある都道府県をタップ！</p>

    <div class="pref-map-wrap" id="pqMapWrap"></div>

    <div id="pqFeedback" style="display:none;">
      <div class="feedback-badge" id="pqFeedbackBadge"></div>
      <p class="feedback-answer" id="pqFeedbackAnswer"></p>
      <p class="feedback-loc" id="pqFeedbackLoc"><span class="material-icons">place</span><span id="pqFeedbackLocText"></span></p>
      <div class="origin-box">
        <div class="label">校章・ロゴの由来</div>
        <p id="pqOriginText"></p>
      </div>
      <button class="btn-primary" id="pqNextBtn">次へ</button>
    </div>
  </section>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <button class="icon-btn modal-close" id="modalClose"><span class="material-icons">close</span></button>
    <div class="modal-logo"><img id="modalImg" src="" alt="ロゴ"></div>
    <p class="modal-name" id="modalName"></p>
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-origin-label">校章・ロゴの由来</div>
    <div class="modal-origin"><p id="modalOrigin"></p></div>
  </div>
</div>

<script>
const IMG_BASE = "https://b8ihua.com/idailogo/";

": "P/P_Tokai.png", "origin": "学園の校章には波と翼がデザインされ、洋々とした大海（太平洋）と、それを俯瞰して悠然と翼を広げ飛翔する かもめを表す。「東海」はアジア東の太平洋を意味し、太平洋のように大きく豊かな心、広い視野を育みたいと いう願いが込められている。", "yomi": "とうかいだいがくいがくぶ", "cat": "P", "loc": "神奈川県伊勢原市", "pref": "kanagawa"}, {"name": "東京女子医科大学", "path": "P/P_TokyoWomens.png", "origin": "情報未確認。円形の中に「TWMU」の文字、周囲に薔薇の意匠。", "yomi": "とうきょうじょしいかだいがく", "cat": "P", "loc": "東京都新宿区河田町", "pref": "tokyo"}, {"name": "愛知医科大学", "path": "P/P_aichiika.PNG", "origin": "校章は、常緑樹「橘（たちばな）」がモチーフ。橘は京都御所で「右近の橘」として珍重され、文化勲章の デザインにもなっている。中国の故事では、橘の葉と井戸水で疫病患者を治療したとされ、後に「橘井 （きっせい）」という語が医師を意味する言葉として使われるようになった。橘の力強い意気をもって世界人類の 幸福に貢献するという思いが込められている。全体構成は愛知の「A」を基本形に、医科の「I」「K」、 「人」の文字をイメージし、医療メスと水平線に見立てたラインは地域に貢献する医療のあり方を表現。", "yomi": "あいちいかだいがく", "cat": "P", "loc": "愛知県長久手市", "pref": "aichi"}, {"name": "岩手医科大学", "path": "P/P_iwateidai.PNG", "origin": "校章の由来：「𨭎」（えい／医術を表す）と「巫」（みこ／神意をうけた治療者を表す）の会意文字、そして 「大」（大学）を図案化したもの。医療の起源の古さと医学者としての心構えを示す。 現行シンボルマークは、岩手山をモチーフに「Iwate」の「i」と「Medical」の「m」を図案化。3学部を3本の ストライプ（𨭎・巫・大）で表し、上の楕円は未来を表現。", "yomi": "いわていかだいがく", "cat": "P", "loc": "岩手県紫波郡矢巾町", "pref": "iwate"}, {"name": "金沢医科大学", "path": "P/P_kanazawaidai.png", "origin": "校章は「橘（たちばな）」の葉と実を図案化したもの。中国の故事『神仙伝』にちなむもので、後漢の名医・ 董奉の故事（「杏林」の由来と同系統の逸話）を意訳したもの。愛知医科大学の校章にも通じる、医師を 指す言葉「橘井（きっせい）」の伝承に基づく。", "yomi": "かなざわいかだいがく", "cat": "P", "loc": "石川県河北郡内灘町", "pref": "ishikawa"}, {"name": "川崎医科大学", "path": "P/P_kawasaki.png", "origin": "シンボルマークは2つの柔らかな形で構成され、人が寄り添う形を抽象化したもの。デザインコンセプトは \"assist\"（ラテン語 \"ad sisto\"＝「傍らに立つ」に由来）で、川崎学園の成果領域である教育・医療・福祉の 基本姿勢を表す。同時に学園の頭文字「K」も表している。統一カラーのブルーは、やさしさ、信頼、清潔感を象徴。 平成18年（2006年）12月制定。", "yomi": "かわさきいかだいがく", "cat": "P", "loc": "岡山県倉敷市", "pref": "okayama"}, {"name": "日本大学医学部", "path": "P/P_nichidai.png", "origin": "明治36年（1903年）の制服制帽制定時に徽章も制定。校名の「日本」にちなみ、国花とされた桜を図案化。 校歌にも「朝日と輝く国の名負いて」とある。現在は「自主創造」を示す新ロゴマーク「Nドット」も制定され、 ロゴカラーは緋色（NICHIDAI RED）。", "yomi": "にほんだいがくいがくぶ", "cat": "P", "loc": "東京都板橋区大谷口上町", "pref": "tokyo"}, {"name": "東邦大学医学部", "path": "P/P_toho2.PNG", "origin": "シンボルマークは、建学の精神「自然・生命・人間」をかたちにしたもの。自然、生命、人間をモチーフにした 12種類のアイコンが集まり青い地球を構成し、自然や生命との調和・共生、助け合い、愛によって結ばれる世界観 を表す。この建学の精神は創立者・額田晉の著書『自然・生命・人間』に由来（英語では\"NATURE LIFE MAN\"）。", "yomi": "とうほうだいがくいがくぶ", "cat": "P", "loc": "東京都大田区大森西", "pref": "tokyo"}, {"name": "東京医科大学", "path": "P/P_tokyoidai.png", "origin": "校章は、東京医学専門学校時代より「醫」の旧漢字の裾を丸くした形。創学運動の学生会本部先輩の帽章に原型が 見られる。この独特の丸い形は弾丸を表現し、学生団が一丸となる意味が込められているとも言われる。 スクールカラーの臙脂色は、血署連判状の血判に最も近い色だからとも伝えられる。", "yomi": "とうきょういかだいがく", "cat": "P", "loc": "東京都新宿区西新宿", "pref": "tokyo"}, {"name": "秋田大学医学部", "path": "N/N_Akita.png", "origin": "前身である秋田鉱山専門学校の校章に使われていた「ダイヤモンドの正八面体」をオマージュしたもので、 ダイヤモンドのブリリアントカットをモチーフに作成。磨き上げることでその輝きを最大限に引き出すダイヤモンド になぞらえ、教育と研究を通じて学生を育成し課題解決の知識とスキルを磨き上げる姿勢、多面的な美しさから 多様な視点を持つグローバルなリーダー育成の理念を象徴する。", "yomi": "あきただいがくいがくぶ", "cat": "N", "loc": "秋田県秋田市", "pref": "akita"}, {"name": "旭川医科大学", "path": "N/N_Asahikawa.png", "origin": "旭川医科大学のイニシャル「A」をストライプで図案化。右上がりに跳ねる様は、豊かな自然の旭川から医療人 及び研究者を育成し、地域に根ざした医療及び福祉のさらなる向上（発信）を表現。薄紫はラベンダーの景観や 医療の英知・国際貢献、緑は再生や生命の輝きを意味する。", "yomi": "あさひかわいかだいがく", "cat": "N", "loc": "北海道旭川市", "pref": "hokkaido"}, {"name": "千葉大学医学部", "path": "N/N_Chiba.png", "origin": "学章（八角形の赤いマーク）は昭和24年（1949年）10月、赤穴宏氏（元千葉大学名誉教授）がデザイン。 Chiba Daigakuの頭文字「C」「D」を組み合わせ、千葉大学の「千」を配して構成。輪郭は無限の生命力を象徴する 「植物の種子」をかたどっている。左側のガーネット（えんじ）色は情熱を、右側の白色は純粋を表現。長年 「シンボルマーク」として使われてきたが、2013年3月に正式に「学章」として制定された。", "yomi": "ちばだいがくいがくぶ", "cat": "N", "loc": "千葉県千葉市中央区", "pref": "chiba"}, {"name": "愛媛大学医学部", "path": "N/N_Ehime.png", "origin": "ブランドマークは、「地域とともに輝く大学」を目指す愛媛大学が「愛媛の知の拠点（ドット・エヒメ）」と なることを決意表明。左の円は太陽を、右の「e」は躍動する姿を、全体はすこやかに伸びていく新芽を表す。 愛媛みかんを連想させる黄色は明朗さ・快活さの象徴。ロゴタイプは、「愛媛」という画数の多い漢字を シンプルに見せるため、和文・欧文ともにシャープなフォルムで構成。", "yomi": "えひめだいがくいがくぶ", "cat": "N", "loc": "愛媛県東温市", "pref": "ehime"}, {"name": "福井大学医学部", "path": "N/N_Fukui.png", "origin": "学章は、二つの円が結びつき無限大（インフィニティ）の形を形成したもの。それらの円は統合前の「福井大学と 福井医科大学」、また「科学と技術」を表し、無限大は新大学の可能性を表現している。中央の反転部には福井 大学の頭文字「f」を表出。色は「福井の美しい海と空」「若さと知性」を表す。2003年の旧福井大学・旧福井 医科大学統合を機に学内外から公募し、2004年10月制定。", "yomi": "ふくいだいがくいがくぶ", "cat": "N", "loc": "福井県吉田郡永平寺町", "pref": "fukui"}, {"name": "岐阜大学医学部", "path": "N/N_Gifu.png", "origin": "学章は、鵜舟と篝火を意味する。篝火は「学問」、舟は「人類の幸福」を象徴するとされる。また、陰陽2体の 組み合わせは天地自然、存在と活動の調和・バランスを表す。黒とオレンジは意志と情熱、感性の豊かさと品位を 表現する。さらに、学章は弓と組み合わさって「G」を形成している。", "yomi": "ぎふだいがくいがくぶ", "cat": "N", "loc": "岐阜県岐阜市", "pref": "gifu"}, {"name": "群馬大学医学部", "path": "N/N_Gumma.png", "origin": "群馬大学の英頭文字「G」をモチーフに、緑と青で豊かな自然環境を表現。学生の成長・活躍、新しい未来の 創造、社会への貢献をイメージしている。", "yomi": "ぐんまだいがくいがくぶ", "cat": "N", "loc": "群馬県前橋市", "pref": "gunma"}, {"name": "浜松医科大学", "path": "N/N_Hamamatsu.png", "origin": "本学のローマ字での頭文字「h」をデザイン化。水色部分が遠州灘（下部分の曲線）、浜名湖の水面、浜松から 望む富士山（右上の突起）で浜松の特色を、全体の曲線が生命の源である自然な水のゆらぎ、医療の重要 キーワード「生命」を表現。オレンジ色の丸と水色部分の両方を合わせて全体を見ると、元気・健康・躍動を 表現した人（丸を頭、水色の両端を手に見立てる）に見え、人類の健康と福祉に貢献することをイメージしている。", "yomi": "はままついかだいがく", "cat": "N", "loc": "静岡県浜松市中央区", "pref": "shizuoka"}, {"name": "広島大学医学部", "path": "N/N_Hiroshima.png", "origin": "学章は、清新な生命とフェニックスの葉を図案化したもの。学内公募で選ばれた工学部学生の作品に修正を加え、 1956年（昭和31年）に制定された。「フェニックス」は灰の中から再生するとされる不死鳥で、原爆によって 廃墟となった広島の地に新たに生まれた大学を、再生・新しい生命の象徴として不死鳥になぞらえたもの。 フェニックスという名前を持つヤシ科植物の葉も図案に採用されている。", "yomi": "ひろしまだいがくいがくぶ", "cat": "N", "loc": "広島県広島市南区", "pref": "hiroshima"}, {"name": "北海道大学医学部", "path": "N/N_Hokkaido_alt.png", "origin": "シンボルマークは、キャンパス内に自生する「オオバナノエンレイソウ」（ユリ科トリリウム属の多年草）を 図案化したもの。1950年の公募による入選作をもとに、創基120周年を機に修正し、1996年（平成8年）に正式な シンボルマークとして決定された。花弁・がく片による六方向への広がりは、北海道大学から日本・世界へ向けて 情報を発信することを意味する。", "yomi": "ほっかいどうだいがくいがくぶ", "cat": "N", "loc": "北海道札幌市北区", "pref": "hokkaido"}, {"name": "東京医科歯科大学", "path": "N/N_Ikashika.png", "origin": "旧東京医科歯科大学の伝統的エンブレムは、ベンゼン環を思わせる六角形の連なりが「醫」の字を囲む意匠。", "yomi": "とうきょういかしかだいがく", "cat": "N", "loc": "東京都文京区湯島", "pref": "tokyo"}, {"name": "香川大学医学部", "path": "N/N_Kagawa.png", "origin": "シンボルマークは、地球規模のグローバルな展開を示す形状を採用。スクールカラーは、香川県の温暖な風土と オリーブをイメージしたグリーン。", "yomi": "かがわだいがくいがくぶ", "cat": "N", "loc": "香川県木田郡三木町", "pref": "kagawa"}, {"name": "金沢大学医学部", "path": "N/N_Kanazawa.png", "origin": "1949年の新制・金沢大学誕生にあわせ、森田亀之助（当時の金沢美術工芸専門学校長）、森嘉紀（当時の同校 講師）、羽野禎三（当時の石川県立工芸高等学校長）の3氏に校章デザインを依頼し、3氏の合作によるデザインが 1949年8月に決定。地中海沿岸原産の植物「アカンサス」（和名「ハアザミ」）の葉と「大學」の文字を図案化した もの。アカンサスの花言葉は「the fine arts」で、その優雅な葉は古代ギリシャ・ローマで好まれ、コリント式や コンポジット式建築の柱頭装飾にも使われ、哲学者プラトン創設の学園「アカデメイア」の庭にも植えられていた と伝えられる。", "yomi": "かなざわだいがくいがくぶ", "cat": "N", "loc": "石川県金沢市", "pref": "ishikawa"}, {"name": "神戸大学医学部", "path": "N/N_Kobe.PNG", "origin": "ロゴマークは平成14年の創立百周年を機に制作。英文名「Kobe University」の頭文字「K」を2羽の鳥に象形化し、 それぞれが大きな軌跡（個性）を描きながら山や海を渡り、大空（世界）へと自由に羽ばたき、時には互いに 助け合いながら進みゆく様子を表現している。配色は、鳥を大学のシンボルカラー「ブリックカラー」とし、 緑は山、青は海をイメージ。", "yomi": "こうべだいがくいがくぶ", "cat": "N", "loc": "兵庫県神戸市中央区", "pref": "hyogo"}, {"name": "高知大学医学部", "path": "N/N_Kochi.png", "origin": "2003年10月の高知大学と高知医科大学の統合を機に、新しい高知大学の学章を公募して制定。「Kochi」のKと 「University」のUを組み合わせた躍動的なデザインで、青は太平洋の波涛・黒潮、空色は若者の可能性と大空を 表す。新生高知大学が未来へ飛躍する姿を表現。制作者は大阪府大阪市の岩永光一氏。", "yomi": "こうちだいがくいがくぶ", "cat": "N", "loc": "高知県南国市", "pref": "kochi"}, {"name": "熊本大学医学部", "path": "N/N_Kumamoto.PNG", "origin": "「くまもと」の「く」と「Kumamoto」の「K」を図案化し、前進する矢印をイメージしている。", "yomi": "くまもとだいがくいがくぶ", "cat": "N", "loc": "熊本県熊本市中央区", "pref": "kumamoto"}, {"name": "大阪大学医学部", "path": "N/N_Kyoto.png", "origin": "現在の学章は、日本を代表するグラフィックデザイナー・田中一光氏によるもの。大阪大学創立60周年の1991年に 制定された。銀杏をモチーフとし、3つの円弧による造形の中に「OSAKA」の「O」を忍ばせている。60年間の伝統を 持つ銀杏を継承しながら、大学・学生・市民のつながりを表現した（戦前は「交差した二枚の銀杏の葉」を 校章としていた）。", "yomi": "おおさかだいがくいがくぶ", "cat": "N", "loc": "大阪府吹田市", "pref": "osaka"}, {"name": "京都大学医学部", "path": "N/N_Kyoto_alt.png", "origin": "現行エンブレムは、吉田キャンパス時計台前のクスノキ（京都大学のシンボル）をモチーフにしたもの （銀杏ではない）。原型は1950年頃、庶務課職員・小川録郎氏が考案し「事務局シール」として使用されていた。 その後、工学部建築学科・川崎清教授と京都芸術短期大学・久谷政樹教授による意匠検討を経て、1990年11月16日 の評議会で正式なエンブレムとして了承された。創立年\"1897\"と大学名（英語）が添えられている。なお、古くは 「葵」のマーク（1949年、学生図案）も襟章として使われていた時期がある。", "yomi": "きょうとだいがくいがくぶ", "cat": "N", "loc": "京都府京都市左京区", "pref": "kyoto"}, {"name": "九州大学医学部", "path": "N/N_Kyushu.png", "origin": "1949年、学生バッジの図案が学生70人・153点の応募の中から選ばれたのが伝統的エンブレムの原型。松の木・葉・ 松かさ・樹皮を図案化したものが多く応募され、当時の病院地区〜箱崎地区一帯に広がっていた松原の記憶が 多くの学生の心に残っていたことがうかがえる。現在のシンボルロゴは2004年、芸術工学研究院・芸術工学府の 教員・学生と広報室によるUIプロジェクトチームが新たに制定。", "yomi": "きゅうしゅうだいがくいがくぶ", "cat": "N", "loc": "福岡県福岡市東区", "pref": "fukuoka"}, {"name": "宮崎大学医学部", "path": "N/N_Miyazaki.png", "origin": "シンボルマークは、大学の頭文字である「宮」をモチーフに図案化し、さらにそれを人の姿として擬人化した もの。白い丸は大学のイメージが徐々に拡大すること、緑の中の2つの丸は宮崎大学と宮崎医科大学の統合を 表す。全体として躍動する若者、地球、世界へ羽ばたく姿を表現。緑は宮崎の自然、青は空と海を表す。", "yomi": "みやざきだいがくいがくぶ", "cat": "N", "loc": "宮崎県宮崎市清武町", "pref": "miyazaki"}, {"name": "長崎大学医学部", "path": "N/N_Nagasaki.PNG", "origin": "シンボルマークは、鎖国時代に世界への文化の門戸となった長崎を象徴するオランダ船の舳先に、Nagasaki Universityの頭文字「NU」を重ね、右肩に「大學」の文字を配置したもの。1949年に、大学構成員の連帯意識を 高め、総合大学として発展するためのシンボルとして制定された。その後、国立大学法人化を機に2005年に正式 ロゴマークとして精緻化された。", "yomi": "ながさきだいがくいがくぶ", "cat": "N", "loc": "長崎県長崎市", "pref": "nagasaki"}, {"name": "名古屋大学医学部", "path": "N/N_Nagoya.png", "origin": "現在の「名大マーク」は、従来の学章をリデザインし、ロゴタイプと組み合わせたもの。大学の国際化と情報 発信力の強化、ビジュアルイメージの統一を目的として制定された。スクールカラーの濃緑には「不屈・永遠」と 「若さ」の意味が込められている（学章そのものの図案の起源までは公式ページから確定できず）。", "yomi": "なごやだいがくいがくぶ", "cat": "N", "loc": "愛知県名古屋市昭和区", "pref": "aichi"}, {"name": "新潟大学医学部", "path": "N/N_Niigata.png", "origin": "校章は雪の結晶をかたどったもの。昭和24年に制定された学生章をもとに、創立50周年を記念して小磯稔名誉 教授がデザインし、校章として制定された。新潟の雪国としての地域性を直接的に表現している。", "yomi": "にいがただいがくいがくぶ", "cat": "N", "loc": "新潟県新潟市中央区", "pref": "niigata"}, {"name": "大分大学医学部", "path": "N/N_Oita.png", "origin": "「OITA」の「O」と「UNIVERSITY」の「U」をモチーフに、2つの円を組み合わせたデザイン。外側の青い円は、 大学が地域・国際社会へ向けて発展し続ける姿、中央の円は人々が集い学び、社会・文化的交流を行う大学 キャンパスを表す。青は知性・誠実・探究心・自立心、黄色は希望・成長・幸福を象徴する。", "yomi": "おおいただいがくいがくぶ", "cat": "N", "loc": "大分県由布市", "pref": "oita"}, {"name": "岡山大学医学部", "path": "N/N_Okayama.png", "origin": "学章は、Okayamaの「O」とUniversityの「U」から形作られ、鳥のように未来に向かって羽ばたき、光り輝く岡山 大学の姿をイメージしたもの。創立50周年記念事業として公募し、マークデザイナー・宮崎利一氏、アート ディレクター・橋ヶ谷佳正教育学部教授による作品。平成11年（1999年）5月からシンボルマークとして使用開始、 平成24年（2012年）4月から正式に学章となった。", "yomi": "おかやまだいがくいがくぶ", "cat": "N", "loc": "岡山県岡山市北区", "pref": "okayama"}, {"name": "琉球大学医学部", "path": "N/N_Ryukyus.png", "origin": "芭蕉の葉と羽根ペンのイメージが核。芭蕉の葉は「琉球諸島の伝統文化や自然」を、羽根ペンは「学問と自由」を 象徴し、両者の組み合わせが「人の和と宇宙」を表す丸い円にまとめられている。", "yomi": "りゅうきゅうだいがくいがくぶ", "cat": "N", "loc": "沖縄県中頭郡西原町", "pref": "okinawa"}, {"name": "佐賀大学医学部", "path": "N/N_Saga.png", "origin": "学章は飛翔するカササギ、格調ある篆書体の「佐大」の文字と英文表記を組み合わせたデザイン。カササギは 佐賀平野に特有な鳥で佐賀県の県鳥、国の天然記念物にも指定されている。長い尾と黒白のコントラストが 個性的で美しく、大学キャンパスにも生息し親しまれている。", "yomi": "さがだいがくいがくぶ", "cat": "N", "loc": "佐賀県佐賀市", "pref": "saga"}, {"name": "滋賀医科大学", "path": "N/N_Shiga.png", "origin": "学章は、「さざ波の滋賀」の波と「一隅を照らす」光の波動を組み合わせたもの。外から中心へ向かう波は 「人々の医への期待」、中心から外へ向かう光の波は「人々の期待に返す答え」を表す。", "yomi": "しがいかだいがく", "cat": "N", "loc": "滋賀県大津市", "pref": "shiga"}, {"name": "島根大学医学部", "path": "N/N_Shimane.png", "origin": "島根の「し」をモチーフに、3本のラインを学生・教職員・ステークホルダーの協働に見立て、人と自然、教育と 研究、地域と世界など、さまざまな要素を「島根大学」が起点となって編み込んでいく様子を表現。青色と黄土色は 日本海・宍道湖、中国山地の大地の恵みと、歴史や文化、産業を表す。縁結びの地に立地する総合大学として、 「知の結び」を社会へ広げ、共に発展していく決意が込められている。", "yomi": "しまねだいがくいがくぶ", "cat": "N", "loc": "島根県出雲市", "pref": "shimane"}, {"name": "信州大学医学部", "path": "N/N_Shinshu.PNG", "origin": "信州大学の頭文字「S」と、信州の大空を舞う鳥を組み合わせたもの。3枚の羽は教育・研究・社会貢献を表し、 3色の緑には信州の自然、学生の成長、大学の発展への願いが込められている。", "yomi": "しんしゅうだいがくいがくぶ", "cat": "N", "loc": "長野県松本市", "pref": "nagano"}, {"name": "東北大学医学部", "path": "N/N_Tohoku.png", "origin": "公式ロゴマークは仙台を象徴する植物「萩」をモチーフとする。世界に向かって大きく広がっていく動きを デザインし、キーワードとして「Creativity」「Global」「Tradition」を掲げる。（旧来は北斗七星をモチーフに した医学系研究科独自のロゴマークもあり、こちらは昭和45年〈1970年〉10月から用いられ、北極星のような 不動の真理を求め世人の道しるべとなろうとする理念を象徴する。）", "yomi": "とうほくだいがくいがくぶ", "cat": "N", "loc": "宮城県仙台市青葉区", "pref": "miyagi"}, {"name": "徳島大学医学部", "path": "N/N_Tokushima.png", "origin": "学章は「TOKUSHIMA」「UNIVERSITY」の頭文字であるTとUを基調にデザイン。背後の四角形は四国を表す。Uの 重なりは、大学の学術・教育の成果が地域・国際社会の発展に貢献し、知と文化が継承されていくことを象徴する。 色彩は、吉野川、徳島の青い空・海、徳島特産の藍をイメージしている。", "yomi": "とくしまだいがくいがくぶ", "cat": "N", "loc": "徳島県徳島市", "pref": "tokushima"}, {"name": "東京大学医学部", "path": "N/N_Tokyo.png", "origin": "現行の「東大マーク」の前身は1948年6月8日、評議会で「銀杏バッジ」として制定（星野昌一・第二工学部教授 作図）。当時は正式な校章ではなかった。2004年の国立大学法人化を機に、渡辺浩副学長を主任とする 「東京大学アイデンティティ作業班」が新たな「東大マーク」を制定。従来の2枚の銀杏の葉を踏襲しつつ、 上の葉を秋に色づく銀杏の黄、下の葉を東大のスクールカラー「淡青」にちなんだ青で配色。長い歴史と伝統を 踏まえ、世界の大学教育・学術研究をリードする決意を表す。", "yomi": "とうきょうだいがくいがくぶ", "cat": "N", "loc": "東京都文京区本郷", "pref": " irosaki.PNG", "origin": "弘前市を象徴する桜をモチーフとして、5学部の桜が集まり一つの大きな花を咲かせる姿を表現。中央の円は 地球を表し、5色は医学部・教育学部・農学生命科学部・理工学部・人文社会科学部の各学部カラーを表す。", "yomi": "ひろさきだいがくいがくぶ", "cat": "N", "loc": "青森県弘前市", "pref": "aomori"}, {"name": "三重大学医学部", "path": "N/N_mie.PNG", "origin": "シンボルマークは緑の斜線が組み合わさった形。MIEの頭文字「M」、UNIVERSITYの頭文字「U」、本やノートを 開いたイメージ（「知」）、海や波のイメージ（キャンパスが海に続く特色を表す「地」）を組み合わせ、旧標章の 外形イメージも尊重して、三重大学教育学部・宮田修平教授（現名誉教授）が作製。2009年、学章とロゴを新たに 制定。", "yomi": "みえだいがくいがくぶ", "cat": "N", "loc": "三重県津市", "pref": "mie"}, {"name": "防衛医科大学校", "path": "G/G_NationalDefenseMedicalCollege.png", "origin": "校章は、鳩・蛇杖・桜花・桜の若葉を組み合わせたもの。桜花は日本の国花、鳩は平和、蛇杖は医学の象徴を 意味する。それらを「国を守る若人」を象徴する桜の若葉が支えている。全体として、日本の独立と平和を守り ながら医学の研鑽に励むことを表現している。", "yomi": "ぼうえいいかだいがっこう", "cat": "G", "loc": "埼玉県所沢市", "pref": "saitama"}];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const collator = new Intl.Collator('ja');
const SORTED_INDEX = DATA
  .map((d,i)=>i)
  .sort((a,b)=> collator.compare(DATA[a].yomi || DATA[a].name, DATA[b].yomi || DATA[b].name));

function poolForCat(cat){
  if(cat === "ALL") return SORTED_INDEX.slice();
  return SORTED_INDEX.filter(i => DATA[i].cat === cat);
}

    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat === 'ALL' ? ' cat-tab-all' : '') + (cat === selectedCat ? ' active' : '');
    btn.innerHTML = `<span class="cat-tab-kanji">${CAT_KANJI[cat]}</span><span class="cat-tab-label">${CAT_LABELS[cat]}</span>`;

/* ---------- QUIZ ---------- */
function startQuiz(){
  retryFn = startQuiz;
  const pool = poolForCat(selectedCat);
  const n = Math.max(1, Math.min(parseInt(els.qCountSlider.value,10) || pool.length, pool.length));
  order = shuffle(pool).slice(0, n);
  current = 0;
  score = 0;
  showScreen('quiz');
  loadQuestion();
}

function renderChoices(filter){
  const f = (filter||'').trim();
  els.choiceList.innerHTML = '';
  const items = SORTED_INDEX
    .map(idx=>({name:DATA[idx].name, yomi:DATA[idx].yomi||'', idx}))
    .filter(d => !f || d.name.startsWith(f) || d.yomi.startsWith(f));
  if(items.length === 0){
    const empty = document.createElement('div');
    empty.className = 'choice-empty';
    empty.textContent = '該当する大学が見つかりません';
    els.choiceList.appendChild(empty);
    return;
  }
  items.forEach(item=>{
    const btn = document.createElement('button');
    btn.className = 'choice-item';
    btn.textContent = item.name;
    btn.addEventListener('click', ()=> selectAnswer(item.idx));
    els.choiceList.appendChild(btn);
  });
}

function loadQuestion(){
  answered = false;
  const qIdx = order[current];
  const q = DATA[qIdx];
  els.logoImg.src = q.img;
  els.logoImg.alt = 'ロゴクイズ';
  els.progText.textContent = `問題 ${current+1} / ${order.length}`;
  els.scoreText.textContent = `正解 ${score}`;
  els.progFill.style.width = ((current)/order.length*100) + '%';
  els.answeringPane.style.display = '';
  els.feedbackPane.style.display = 'none';
  els.searchInput.value = '';
  renderChoices('');
}

function selectAnswer(chosenIdx){
  if(answered) return;
  answered = true;
  const correctIdx = order[current];
  const isCorrect = chosenIdx === correctIdx;
  if(isCorrect) score++;

  els.answeringPane.style.display = 'none';
  els.feedbackPane.style.display = 'flex';
  els.feedbackBadge.className = 'feedback-badge ' + (isCorrect ? 'correct' : 'wrong');
  els.feedbackBadge.textContent = isCorrect ? '○ 正解！' : '✕ 不正解';
  els.feedbackAnswer.textContent = DATA[correctIdx].name;
  els.feedbackLocText.textContent = DATA[correctIdx].loc || '';
  if(!isCorrect){
    els.feedbackYourAnswer.style.display = '';
    els.feedbackYourAnswer.textContent = `あなたの回答：${DATA[chosenIdx].name}`;
  } else {
    els.feedbackYourAnswer.style.display = 'none';
  }
  els.originText.textContent = DATA[correctIdx].origin;
  els.scoreText.textContent = `正解 ${score}`;
  els.progFill.style.width = ((current+1)/order.length*100) + '%';
  els.nextBtn.textContent = (current+1 < order.length) ? '次の問題へ' : '結果を見る';
}

function nextQuestion(){
  current++;
  if(current >= order.length){
    finishQuiz();
  } else {
    loadQuestion();
  }
}

function finishQuiz(){
  showScreen('result');
  els.resultScore.innerHTML = `${score}<span>/${order.length}</span>`;
  const pct = score / order.length;
  let comment;
  if(pct === 1) comment = '全問正解。もう見分けられますね。';
  else if(pct >= 0.8) comment = 'かなりの正答率。ロゴ通と言っていいレベルです。';
  else if(pct >= 0.5) comment = '半分以上正解。見覚えのあるロゴが増えてきたのでは。';
  else if(pct >= 0.2) comment = 'まだ知らないロゴがたくさんありそうです。もう一度挑戦してみましょう。';
  else comment = '最初は誰でもこんなもの。由来を読みながらもう一周してみてください。';
  els.resultComment.textContent = comment;
}

function findPrefEl(key){
  return els.pqMapWrap.querySelector(`.prefecture.${key}`);
}

function onPrefTap(key, el){
  if(pqAnswered) return;
  pqAnswered = true;
  els.pqMapWrap.classList.add('answered');
  const idx = order[current];
  const correctKey = DATA[idx].pref;
  const isCorrect = key === correctKey;
  if(isCorrect) score++;

  el.classList.add(isCorrect ? 'pq-correct' : 'pq-wrong');
  if(!isCorrect){
    const correctEl = findPrefEl(correctKey);
    if(correctEl) correctEl.classList.add('pq-correct');
  }

  els.pqScoreText.textContent = `正解 ${score}`;
  els.pqProgFill.style.width = ((current+1)/order.length*100) + '%';
  els.pqFeedbackBadge.className = 'feedback-badge ' + (isCorrect ? 'correct' : 'wrong');
  els.pqFeedbackBadge.textContent = isCorrect ? '○ 正解！' : '✕ 不正解';
  els.pqFeedbackAnswer.textContent = DATA[idx].name;
  els.pqFeedbackLocText.textContent = DATA[idx].loc || '';
  els.pqOriginText.textContent = DATA[idx].origin || '';
  els.pqFeedback.style.display = 'block';
  els.pqNextBtn.textContent = (current+1 < order.length) ? '次へ' : '結果を見る';
}

function nextPrefQuestion(){
  current++;
  if(current >= order.length){
    finishQuiz();
  } else {
    loadPrefQuestion();
  }
}

function axisTransform(axis, val){
  return axis === 'X' ? `translate(${val}, 0)` : `translate(0, ${val})`;
}

function setLayerImg(el, idx){
  el.innerHTML = `<img src="${DATA[idx].img}" alt="">`;
}

function buildMosaic(){
  mosaicGridEl.innerHTML = '';
  for(let i=0;i<MOSAIC_COUNT;i++){
    const cell = document.createElement('div');
    cell.className = 'mosaic-cell';
    const layerA = document.createElement('div');
    layerA.className = 'mosaic-inner';
    const layerB = document.createElement('div');
    layerB.className = 'mosaic-inner';
    cell.appendChild(layerA);
    cell.appendChild(layerB);
    mosaicGridEl.appendChild(cell);

    const idx = randDataIndex();
    layerA.style.transition = 'none';
    layerA.style.transform = 'translate(0,0)';
    setLayerImg(layerA, idx);
    layerB.style.transition = 'none';
    layerB.style.transform = 'translate(100%,0)';

    mosaicCells.push({ elA: layerA, elB: layerB, activeIsA: true, idx, animating:false });
  }
}
buildMosaic();

function animateCell(cs){
  cs.animating = true;
  const curEl = cs.activeIsA ? cs.elA : cs.elB;
  const nextEl = cs.activeIsA ? cs.elB : cs.elA;
  const dir = randAxisDir();

  let nextIdx;
  do { nextIdx = randDataIndex(); } while(nextIdx === cs.idx);
  setLayerImg(nextEl, nextIdx);

  nextEl.style.transition = 'none';
  nextEl.style.transform = axisTransform(dir.axis, dir.enter);
  void nextEl.offsetWidth;

  requestAnimationFrame(()=>{
    curEl.style.transition = 'transform .6s cubic-bezier(.4,0,.2,1)';
    nextEl.style.transition = 'transform .6s cubic-bezier(.4,0,.2,1)';
    curEl.style.transform = axisTransform(dir.axis, dir.exit);
    nextEl.style.transform = 'translate(0,0)';
  });

  setTimeout(()=>{
    cs.idx = nextIdx;
    cs.activeIsA = !cs.activeIsA;
    cs.animating = false;
  }, 640);
}

setInterval(()=>{
  mosaicCells.forEach(cs=>{
    if(!cs.animating && Math.random() < 0.5) animateCell(cs);
  });
}, 2400);


/* ---------- REVERSE MODE (name -> logo, no scoring) ---------- */
let revOrder = [];
let revCurrent = 0;

function startReverse(){
  const pool = poolForCat(selectedCat);
  const n = Math.max(1, Math.min(parseInt(els.qCountSlider.value,10) || pool.length, pool.length));
  revOrder = shuffle(pool).slice(0, n);
  revCurrent = 0;
  showScreen('reverse');
  els.revCardPane.style.display = 'flex';
  els.revDonePane.style.display = 'none';
  loadReverseCard();
}

function loadReverseCard(){
  const idx = revOrder[revCurrent];
  els.revNameCard.textContent = DATA[idx].name;
  els.revLogoImg.src = DATA[idx].img;
  els.revLogoCard.style.display = 'none';
  els.revLoc.style.display = 'none';
  els.revOriginBox.style.display = 'none';
  els.revRevealBtn.style.display = '';
  els.revNextBtn.style.display = 'none';
  els.revProgText.textContent = `${revCurrent+1} / ${revOrder.length}`;
  els.revProgFill.style.width = ((revCurrent)/revOrder.length*100) + '%';
}

function revealReverseLogo(){
  const idx = revOrder[revCurrent];
  els.revLogoCard.style.display = 'flex';
  els.revLocText.textContent = DATA[idx].loc || '';
  els.revLoc.style.display = 'flex';
  els.revOriginText.textContent = DATA[idx].origin || '';
  els.revOriginBox.style.display = 'block';
  els.revRevealBtn.style.display = 'none';
  els.revNextBtn.style.display = '';
  els.revProgFill.style.width = ((revCurrent+1)/revOrder.length*100) + '%';
}

function nextReverseCard(){
  revCurrent++;
  if(revCurrent >= revOrder.length){
    els.revCardPane.style.display = 'none';
    els.revDonePane.style.display = 'flex';
  } else {
    loadReverseCard();
  }
}
