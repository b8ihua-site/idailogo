<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>医大のロゴを学ぼう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=WDXL+Lubrifont+JP+N&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#6E6E6E;
    --line:#E1E1E1;
    --accent:#111111;
    --accent-tint:#F0F0F0;
    --correct:#2F6E4E;
    --correct-bg:#E9F3EC;
    --wrong:#A63B32;
    --wrong-bg:#FBEDEB;
    --tap-bg:#F2F2F2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans JP", sans-serif;
    background: var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .material-icons{ font-size:20px; line-height:1; user-select:none; }

  #app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- APP HEADER (persistent) ---------- */
  .app-header{
    position:sticky; top:0; z-index:30;
    display:flex;
    align-items:center;
    padding:16px 18px;
    background:#fff;
  }
  .app-header-title{
    font-family:"WDXL Lubrifont JP N", sans-serif;
    font-weight:400;
    font-size:22px;
    letter-spacing:.05em;
    color:#0067AD;
  }
  .back-icon{
    width:0; opacity:0; overflow:hidden;
    margin-right:0;
    background:transparent; border:none; padding:0;
    display:flex; align-items:center; justify-content:center;
    color:#007765; cursor:pointer;
    transition: width .28s ease, opacity .22s ease, margin-right .28s ease;
    flex-shrink:0;
  }
  .app-header.show-back .back-icon{
    width:24px; opacity:1; margin-right:6px;
  }
  .back-icon .material-icons{ font-size:26px; }
  .icon-btn{
    width:36px; height:36px; border-radius:8px; border:1.5px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0; color:var(--ink);
  }
  .icon-btn:active{ background:var(--tap-bg); }

  .screen{ display:none; flex-direction:column; flex:1; padding:20px 18px 28px; }
  .screen.active{ display:flex; }

  /* ---------- HOME ---------- */
  #home{ gap:0; }
  .mosaic-wrap{
    margin: 0px -18px 24px;
    overflow:hidden;
  }
  .mosaic-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:4px;
    width:114%;
    margin-left:-7%;
  }
  .mosaic-cell{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#fff;
    border:1px solid #EDEDED;
  }
  .mosaic-inner{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  .mosaic-inner.is-logo{ background:#fff; padding:10%; }
  .mosaic-inner.is-logo img{ width:100%; height:100%; object-fit:contain; }
  .mosaic-inner.is-name{
    background:#111; color:#fff;
    font-size:9.5px; font-weight:700; line-height:1.35;
    text-align:center; padding:8%;
  }
  .home-desc{
    font-size:14px; line-height:1.8; color:var(--ink-soft);
    margin:2px 0 24px; text-align:left;
  }

  .cat-label{
    font-size:12px; color:var(--ink-soft); font-weight:600; margin:0 0 10px 2px;
  }
  .cat-tabs{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;
  }
  .cat-tab{
    flex:1 1 auto;
    min-width:calc(33% - 6px);
    text-align:center;
    padding:10px 8px;
    border-radius:8px;
    border:1px solid #000;
    background:#fff;
    color:#000;
    font-family:"Noto Sans JP", sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .cat-tab.active{
    border-color:#000;
    background:#000;
    color:#fff;
  }
  .cat-count{
    font-size:12.5px; color:var(--ink-soft); margin-bottom:24px;
  }
  .cat-count b{ color:var(--ink); font-weight:700; }

  .slider-block{ margin-bottom:28px; }
  .slider-label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:var(--ink-soft); font-weight:600; margin-bottom:10px;
  }
  .slider-label b{ font-size:20px; color:var(--ink); font-weight:800; margin:0 2px; }
  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:4px; border-radius:99px;
    background:var(--line); outline:none; margin:0;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:#fff; border:2px solid var(--ink); cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:#fff; border:3px solid var(--ink); cursor:pointer;
  }

  .home-actions{ display:flex; flex-direction:column; gap:10px; margin-top:auto; }

  .btn-primary{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:#fff; border:none;
    font-family:"Noto Sans JP", sans-serif; font-weight:700; font-size:16px;
    padding:16px 20px; border-radius:8px; cursor:pointer;
  }
  .btn-secondary{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:#fff; color:var(--ink); border:1.5px solid var(--accent);
    font-family:"Noto Sans JP", sans-serif; font-weight:700; font-size:16px;
    padding:14.5px 20px; border-radius:8px; cursor:pointer;
  }
  .btn-ghost{
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:var(--ink); border:1.5px solid var(--ink);
    font-family:"Noto Sans JP", sans-serif; font-weight:600; font-size:14.5px;
    padding:13px 20px; border-radius:8px; cursor:pointer; margin-top:12px;
  }

  /* ---------- SHARED TOPBAR (in-screen, e.g. study) ---------- */
  .topbar{
    display:flex; align-items:center; gap:10px; margin-bottom:16px;
  }
  .topbar-title{ font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:16px; color:var(--ink); }

  /* ---------- QUIZ ---------- */
  #quiz{ gap:0; }
  .quiz-topbar{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; padding:0 2px;
  }
  .quiz-topbar .prog{ font-weight:600; letter-spacing:.03em; }
  .quiz-topbar .score{ font-weight:600; color:var(--ink); }
  .progress-track{
    height:4px; background:var(--line); border-radius:99px; margin-bottom:20px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }

  .logo-card{
    background:#FFFFFF;
    padding:26px 20px;
    display:flex; align-items:center; justify-content:center;
    height:200px;
    margin-bottom:18px;
  }
  .logo-card img{ max-width:100%; max-height:150px; object-fit:contain; }

  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-wrap input{
    width:100%; padding:10px 8px 10px 30px; font-size:14.5px;
    border:none; border-bottom:2px solid var(--ink); border-radius:0; background:transparent;
    font-family:"Noto Sans JP", sans-serif; color:var(--ink);
    outline:none;
  }
  .search-wrap .icon{
    position:absolute; left:2px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); display:flex;
  }

  .choice-list{
    flex:1;
    overflow-y:auto;
    max-height:280px;
  }
  .choice-item{
    display:block; width:100%; text-align:left;
    padding:13px 4px; font-size:14.5px; font-family:"Noto Sans JP", sans-serif;
    background:none; border:none; border-bottom:1px solid #000;
    color:var(--ink); cursor:pointer;
  }
  .choice-item:active{ background:var(--tap-bg); }
  .choice-empty{ padding:24px 4px; text-align:center; color:var(--ink-soft); font-size:13.5px; }

  /* ---------- FEEDBACK ---------- */
  .feedback-badge{
    display:inline-flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:99px; font-weight:700; font-size:14.5px;
    margin-bottom:14px; width:fit-content;
  }
  .feedback-badge.correct{ background:var(--correct-bg); color:var(--correct); }
  .feedback-badge.wrong{ background:var(--wrong-bg); color:var(--wrong); }

  .feedback-answer{
    font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:19px;
    color:var(--ink); margin:0 0 4px;
  }
  .feedback-your-answer{
    font-size:13px; color:var(--wrong); margin:0 0 14px;
  }

  .origin-box{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:16px 16px; margin-bottom:18px; flex:1; overflow-y:auto;
  }
  .origin-box .label{
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px;
  }
  .origin-box p{
    font-size:14px; line-height:1.9; color:var(--ink); margin:0;
  }

  /* ---------- RESULT ---------- */
  #result{ justify-content:center; text-align:center; }
  .result-eyebrow{
    font-size:12px; letter-spacing:.14em; color:var(--ink-soft);
    margin-bottom:10px; font-weight:700; text-align:center;
  }
  .result-score{
    font-family:"Noto Sans JP", sans-serif; font-weight:900; font-size:56px;
    color:var(--ink); line-height:1; margin:6px 0 4px;
  }
  .result-score span{ font-size:22px; font-weight:600; color:var(--ink-soft); }
  .result-label{ font-size:14px; color:var(--ink-soft); margin-bottom:26px; }
  .result-comment{
    font-size:15px; line-height:1.8; color:var(--ink); margin:0 auto 30px; max-width:320px;
  }

  /* ---------- STUDY GRID ---------- */
  #study{ gap:0; }
  .study-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    overflow-y:auto;
    padding-bottom:10px;
  }
  .study-card{
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:14px 10px 12px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer;
  }
  .study-card:active{ background:var(--tap-bg); }
  .study-card img{ width:100%; height:64px; object-fit:contain; }
  .study-card .sc-name{
    font-size:12px; text-align:center; line-height:1.45; color:var(--ink);
    font-weight:500;
  }
  .study-empty{ text-align:center; color:var(--ink-soft); font-size:13.5px; padding:40px 0; }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,0.5);
    display:none; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.active{ display:flex; }
  .modal-sheet{
    width:100%; max-width:460px; background:#fff;
    border-radius:16px 16px 0 0;
    padding:22px 20px 26px;
    max-height:82vh; overflow-y:auto;
    position:relative;
  }
  .modal-close{
    position:absolute; top:14px; right:16px;
  }
  .modal-logo{
    display:flex; align-items:center; justify-content:center;
    height:140px; margin-bottom:16px;
  }
  .modal-logo img{ max-width:100%; max-height:120px; object-fit:contain; }
  .modal-name{
    font-family:"Noto Sans JP", sans-serif; font-weight:800; font-size:19px;
    color:var(--ink); margin:0 0 2px; text-align:center;
  }
  .modal-cat{
    text-align:center; font-size:11.5px; color:var(--ink-soft); font-weight:600;
    letter-spacing:.06em; margin-bottom:16px;
  }
  .modal-origin-label{
    font-size:11px; letter-spacing:.1em; color:var(--ink-soft); font-weight:700; margin-bottom:8px;
  }
  .modal-origin p{ font-size:14px; line-height:1.9; color:var(--ink); margin:0; }
</style>
</head>
<body>
<div id="app">

  <div class="app-header" id="appHeader">
    <button class="back-icon" id="headerHomeBtn"><span class="material-icons">chevron_left</span></button>
    <span class="app-header-title">医大のロゴを学ぼう</span>
  </div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="mosaic-wrap"><div class="mosaic-grid" id="mosaicGrid"></div></div>
    <p class="home-desc">国公立・私立・防衛医科大学校まで、全82校の校章とロゴマークを収録。カテゴリと出題数を選んで、クイズに挑戦するか、由来をじっくり学べます。</p>

    <div class="cat-label">対象を選ぶ</div>
    <div class="cat-tabs" id="catTabs"></div>
    <div class="cat-count" id="catCount"></div>

    <div class="slider-block">
      <div class="slider-label">出題数　<span><b id="qCountVal">10</b>問</span></div>
      <input type="range" id="qCountSlider" min="1" max="82" value="10">
    </div>

    <div class="home-actions">
      <button class="btn-primary" id="startBtn">クイズに挑戦する</button>
      <button class="btn-secondary" id="studyBtn">ロゴを学習する</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen">
    <div class="quiz-topbar">
      <span class="prog" id="progText">問題 1 / 82</span>
      <span class="score" id="scoreText">正解 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

    <div class="logo-card" id="logoCard">
      <img id="logoImg" src="" alt="ロゴ">
    </div>

    <div id="answeringPane">
      <div class="search-wrap">
        <span class="icon material-icons">search</span>
        <input type="text" id="searchInput" placeholder="大学名・ひらがなで検索...">
      </div>
      <div class="choice-list" id="choiceList"></div>
    </div>

    <div id="feedbackPane" style="display:none; flex:1; flex-direction:column;">
      <div class="feedback-badge" id="feedbackBadge"></div>
      <p class="feedback-answer" id="feedbackAnswer"></p>
      <p class="feedback-your-answer" id="feedbackYourAnswer"></p>
      <div class="origin-box">
        <div class="label">校章・ロゴの由来</div>
        <p id="originText"></p>
      </div>
      <button class="btn-primary" id="nextBtn">次の問題へ</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="result-eyebrow">RESULT</div>
    <div class="result-score" id="resultScore">0<span>/82</span></div>
    <div class="result-label">正解</div>
    <p class="result-comment" id="resultComment"></p>
    <button class="btn-primary" id="retryBtn">もう一度挑戦する</button>
    <button class="btn-ghost" id="homeBtn">ホームに戻る</button>
  </section>

  <!-- STUDY -->
  <section id="study" class="screen">
    <div class="topbar">
      <button class="icon-btn" id="studyBackBtn"><span class="material-icons">arrow_back</span></button>
      <span class="topbar-title" id="studyTitle">学習：すべて</span>
    </div>
    <div class="search-wrap">
      <span class="icon material-icons">search</span>
      <input type="text" id="studySearch" placeholder="大学名・ひらがなで検索...">
    </div>
    <div style="height:12px;"></div>
    <div class="study-grid" id="studyGrid"></div>
  </section>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <button class="icon-btn modal-close" id="modalClose"><span class="material-icons">close</span></button>
    <div class="modal-logo"><img id="modalImg" src="" alt="ロゴ"></div>
    <p class="modal-name" id="modalName"></p>
    <div class="modal-cat" id="modalCat"></div>
    <div class="modal-origin-label">校章・ロゴの由来</div>
    <div class="modal-origin"><p id="modalOrigin"></p></div>
  </div>
</div>

<script>
const IMG_BASE = "https://b8ihua.com/idailogo/";
const DATA_RAW = [{"name": "福島県立医科大学", "path": "Q/Q_Fukushima.png", "origin": "緑・サクラ・「F」の文字を組み合わせ、大学らしさを視覚化。立志哲洋氏（東京都）の作品。平成20年11月2日制定。", "yomi": "ふくしまけんりついかだいがく", "cat": "Q"}, {"name": "京都府立医科大学", "path": "Q/Q_Kyoto.png", "origin": "情報未確認（校章の具体的な意匠の由来は見当たらず）。1872年、東山・粟田口青蓮院に仮療病院を開設したのが起源。", "yomi": "きょうとふりついかだいがく", "cat": "Q"}, {"name": "名古屋市立大学医学部", "path": "Q/Q_Nagoya.png", "origin": "3種類のシンボルが存在。①学章：昭和25年（1950年）評議会で審議決定、公式な場で使用。②ハートマーク： 昭和34年（1959年）制作、医学研究科・薬学研究科由来の伝統を象徴、同窓会が使用。③NCUマーク：開学50周年 （2000年）記念に制作、他校との差別化・ブランディング用。シンボルカラー「エンジ色」は、強い意志・情熱、 不屈の精神、積み重ねる伝統を意識させる色。", "yomi": "なごやしりつだいがくいがくぶ", "cat": "Q"}, {"name": "奈良県立医科大学", "path": "Q/Q_Nara.png", "origin": "イニシャル「N」がモチーフ。二重の円弧は医学と看護学の支え合う関係を意味し、そこから伸びる葉形は医療人 としての成長・未来への飛躍をイメージ。「奈良県立医科大学の将来像」（H29年策定）の道しるべとして、 デザイン案を一般公募し制定。", "yomi": "ならけんりついかだいがく", "cat": "Q"}, {"name": "大阪公立大学医学部", "path": "Q/Q_Osaka.png", "origin": "シンボルマークの軸は「銀杏」「ヤシ」「桜」。大阪市立大学と大阪府立大学、大阪府と大阪市を象徴する3つの 伝統的シンボルが融合したもの。約140年間大阪を牽引してきた2大学の伝統と、公立大学として地域に根差した 教育・研究を続ける姿勢を示す。中心から伸びやかに花ひらくフォルムは「知の拠点」に人や知が結集し、世界へ 飛翔していく姿を表す。（参考：大阪府立大学（旧）は3枚の銀杏で3つの府立大学統合を、大阪市立大学は商神 マーキュリーの杖翼と市章「みをつくし」をモチーフにしていた）", "yomi": "おおさかこうりつだいがくいがくぶ", "cat": "Q"}, {"name": "札幌医科大学", "path": "Q/Q_Sapporo.png", "origin": "現シンボルマークは開学30周年（1980年）記念で制定。同窓会協力のもと学内・卒業生から図案を公募し、 「北海道デザイン界の父」栗谷川健一氏がデザイン。蛇の形は大学の頭文字「S」、下が太くなった杖は大地に 根を張る不動のたくましさを表す。北海道を象徴する「七光星」、飛躍と発展を示す「羽」、英知と質実を表す 「柏の葉」も描かれている。", "yomi": "さっぽろいかだいがく", "cat": "Q"}, {"name": "和歌山県立医科大学", "path": "Q/Q_Wakayama.png", "origin": "校章は、和歌山出身の医聖・華岡青洲が全身麻酔薬として用いた「まんだらげ（チョウセンアサガオ）」の花に 「医」の文字を組み合わせたもの。花の図案は陶芸家・富本憲吉が制作したもので、もともとは1963年（昭和38年） の医学総会のために描かれた。その後「医」の文字を加え、長く大学のマークとして使用され、1987年（昭和62年） に正式な校章として認定された。", "yomi": "わかやまけんりついかだいがく", "cat": "Q"}, {"name": "横浜市立大学医学部", "path": "Q/Q_Yokohama.png", "origin": "現行の校章（旧字体の「大学」の文字を取り囲む意匠）は1949年の新制大学発足以来使用。諸説あるが、 港横浜のイメージから「神奈川県の鳥」であるカモメ3羽を表しているとも言われる。 現行シンボルマーク（YCUの3文字を組み合わせたもの）は2005年4月の公立大学法人化を機に制定。全国公募27点の中から 選考委員会が選出、原案作者は当時神奈川県立川和高校3年生・豊浦万莉絵さん。光・輝く未来をイメージする色で、 学生の強い精神力・情熱・利他的な愛を ペンマークは、明治18年（1885年）頃、塾生が教科書中の一節「ペンは剣よりも強し」にヒントを得て、帽章と して自分たちで考案したのが始まり。慶應義塾が公式に制定したものではなく塾生有志のアイデアから生まれ、 歳月を経て公認された。1990年、大学紋章（エンブレム）が別途制定され、ペンマークと塾旗の色調を基調に、 ラテン語 \"Calamvs Gladio Fortior\"（ペンは剣より強し）などで構成されている。", "yomi": "けいおうぎじゅくだいがくいがくぶ", "cat": "P"}, {"name": "近畿大学医学部", "path": "P/P_Kindai.png", "origin": "学園章（校章）は、学園花である梅の花弁をモチーフ。「梅花霜雪を経て開く」（自然の厳しさを経て、春いちばん 品格高き花が咲きひらく）という思いを象徴。5つの花弁と中心の花芯で「大学」の「大」の字と「人」そのものを 表現し、大学の現在・未来に向かっての存在と位置をかたどる。花弁の一部が離れているのは未来志向に基づく 内面の未完、さらなる充溢・完熟を目指す形姿を表す。平成2年6月、創立65周年を記念して学園シンボルマークとして 制定。", "yomi": "きんきだいがくいがくぶ", "cat": "P"}, {"name": "北里大学医学部", "path": "P/P_Kitasato.png", "origin": "学祖・北里柴三郎の建学の精神「開拓」（科学者としてのパイオニア精神）「報恩」（社会への感謝と貢献） 「叡智と実践」「不撓不屈」に由来。盾型エンブレムの「KITASATO UNIV.」文字と意匠は、この精神を象徴する 伝統的な校章として使われている。", "yomi": "きたさとだいがくいがくぶ", "cat": "P"}, {"name": "久留米大学医学部", "path": "P/P_Kurume.png", "origin": "久留米大学の「久」の字をモチーフにした未来的な表現。本来\"変わらない\"という意味を持つ「久」を用いることで、 創立時の理念や役割を継承しつつ永続的な発展を表現。「久」を形作る円は豊かな人間性とグローバルな視野を 表し、5つの円は現在の5学部を表す。2008年制定、2009年商標登録。", "yomi": "くるめだいがくいがくぶ", "cat": "P"}, {"name": "杏林大学医学部", "path": "P/P_Kyorin.png", "origin": "「杏林」の名は、後漢時代の名医・董奉（とうほう）が治療費の代わりに患者に杏の木を植えさせ、やがて林と なったという故事に由来し、「良医」「社会への貢献」を意味する語。 シンボルマーク（2006年制定）は、建学の精神「真・善・美の探究」の3要素を三角形の3つの角で表現。安定した 不変の角が「真」、豊かな曲線に囲まれた角が「善」、天空に伸びる曲線の角が「美」、そして新しい風が「杏林」 の意味する社会貢献を表す。", "yomi": "きょうりんだいがくいがくぶ", "cat": "P"}, {"name": "日本医科大学", "path": "P/P_NipponMedicalSchool.png", "origin": "現行エンブレムは、ギリシャ神話由来のアスクレピオスの杖（医療の象徴）と「NMS」の文字を組み合わせたもの。", "yomi": "にっぽんいかだいがく", "cat": "P"}, {"name": "大阪医科薬科大学", "path": "P/P_OMPU.PNG", "origin": "「大阪医科薬科大学」のイニシャル「O」と英文頭文字「OMPU」がもとになっている。「O」を模した上部デザインは ハートをイメージし生命の躍動を表現。2色の「O」の重なりには『大阪医科大学と大阪薬科大学の統合による医療の 発展』の意味が込められている。「ひとに寄り添うまごころ」とその基盤となる「高度な教育・研究」を表す。 2021年4月の大学統合にあたり制定。", "yomi": "おおさかいかやっかだいがく", "cat": "P"}, {"name": "埼玉医科大学", "path": "P/P_Saitama.png", "origin": "校章：「大學」の文字を支える三個の巴形は、大学名に冠している埼玉の象徴である勾玉を表す。勾玉は埼玉県章 にも用いられ、\"魂、中心、円満\"を意味するといわれている。（記念誌「創立十年のあゆみ」より）", "yomi": "さいたまいかだいがく", "cat": "P"}, {"name": "産業医科大学", "path": "P/P_Sangyo.png", "origin": "9つの円を「人・企業・社会」に見立て、「人の健康」が「企業の健康」をつくり、それが「社会の健康」に つながるという考え方をロゴ化したもの。", "yomi": "さんぎょういかだいがく", "cat": "P"}, {"name": "昭和医科大学", "path": "P/P_Showa.png", "origin": "校章は百合の花に「昭大」の文字を組み合わせたもの。百合は純潔、謙虚さ、優しい心、美のシンボルとされる。", "yomi": "しょうわいかだいがく", "cat": "P"}, {"name": "聖マリアンナ医科大学", "path": "P/P_StMarianna.png", "origin": "情報未確認（校章デザイン自体の由来は見当たらず）。建学の精神は「キリスト教的人類愛に根ざした生命の 尊厳」。", "yomi": "せいまりあんないかだいがく", "cat": "P"}, {"name": "帝京大学医学部", "path": "P/P_Teikyo.png", "origin": "学章は、蔦（つた）の葉がモチーフ。縦書きの「大學」の文字の両脇に蔦の葉を垂らしたデザイン。 シンボルマーク（創立50周年・2016年制定）は、「TEIKYO」のイニシャル「T」を3つの楕円で図案化。3つの 楕円は垣根を超えてはばたく学生たちを表し、同時に教育指針「実学」「国際性」「開放性」をシンボライズ。 中央の白い楕円は学生たちの未知なる力を表現。", "yomi": "ていきょうだいがくいがくぶ", "cat": "P"}, {"name": "東北医科薬科大学", "path": "P/P_Tohokuika.png", "origin": "ロゴマークに表示されている6つの星は東北6県を表し、地域社会とのさらなる協働を願う気持ちが込められている。", "yomi": "とうほくいかやっかだいがく", "cat": "P"}, {"name": "東海大学医学部", "path": "P/P_Tokai.png", "origin": "学園の校章には波と翼がデザインされ、洋々とした大海（太平洋）と、それを俯瞰して悠然と翼を広げ飛翔する かもめを表す。「東海」はアジア東の太平洋を意味し、太平洋のように大きく豊かな心、広い視野を育みたいと いう願いが込められている。", "yomi": "とうかいだいがくいがくぶ", "cat": "P"}, {"name": "東京女子医科大学", "path": "P/P_TokyoWomens.png", "origin": "情報未確認。円形の中に「TWMU」の文字、周囲に薔薇の意匠。", "yomi": "とうきょうじょしいかだいがく", "cat": "P"}, {"name": "愛知医科大学", "path": "P/P_aichiika.PNG", "origin": "校章は、常緑樹「橘（たちばな）」がモチーフ。橘は京都御所で「右近の橘」として珍重され、文化勲章の デザインにもなっている。中国の故事では、橘の葉と井戸水で疫病患者を治療したとされ、後に「橘井 （きっせい）」という語が医師を意味する言葉として使われるようになった。橘の力強い意気をもって世界人類の 幸福に貢献するという思いが込められている。全体構成は愛知の「A」を基本形に、医科の「I」「K」、 「人」の文字をイメージし、医療メスと水平線に見立てたラインは地域に貢献する医療のあり方を表現。", "yomi": "あいちいかだいがく", "cat": "P"}, {"name": "岩手医科大学", "path": "P/P_iwateidai.PNG", "origin": "校章の由来：「𨭎」（えい／医術を表す）と「巫」（みこ／神意をうけた治療者を表す）の会意文字、そして 「大」（大学）を図案化したもの。医療の起源の古さと医学者としての心構えを示す。 現行シンボルマークは、岩手山をモチーフに「Iwate」の「i」と「Medical」の「m」を図案化。3学部を3本の ストライプ（𨭎・巫・大）で表し、上の楕円は未来を表現。", "yomi": "いわていかだいがく", "cat": "P"}, {"name": "金沢医科大学", "path": "P/P_kanazawaidai.png", "origin": "校章は「橘（たちばな）」の葉と実を図案化したもの。中国の故事『神仙伝』にちなむもので、後漢の名医・ 董奉の故事（「杏林」の由来と同系統の逸話）を意訳したもの。愛知医科大学の校章にも通じる、医師を 指す言葉「橘井（きっせい）」の伝承に基づく。", "yomi": "かなざわいかだいがく", "cat": "P"}, {"name": "川崎医科大学", "path": "P/P_kawasaki.png", "origin": "シンボルマークは2つの柔らかな形で構成され、人が寄り添う形を抽象化したもの。デザインコンセプトは \"assist\"（ラテン語 \"ad sisto\"＝「傍らに立つ」に由来）で、川崎学園の成果領域である教育・医療・福祉の 基本姿勢を表す。同時に学園の頭文字「K」も表している。統一カラーのブルーは、やさしさ、信頼、清潔感を象徴。 平成18年（2006年）12月制定。", "yomi": "かわさきいかだいがく", "cat": "P"}, {"name": "日本大学医学部", "path": "P/P_nichidai.png", "origin": "明治36年（1903年）の制服制帽制定時に徽章も制定。校名の「日本」にちなみ、国花とされた桜を図案化。 校歌にも「朝日と輝く国の名負いて」とある。現在は「自主創造」を示す新ロゴマーク「Nドット」も制定され、 ロゴカラーは緋色（NICHIDAI RED）。", "yomi": "にほんだいがくいがくぶ", "cat": "P"}, {"name": "東邦大学医学部", "path": "P/P_toho2.PNG", "origin": "シンボルマークは、建学の精神「自然・生命・人間」をかたちにしたもの。自然、生命、人間をモチーフにした 12種類のアイコンが集まり青い地球を構成し、自然や生命との調和・共生、助け合い、愛によって結ばれる世界観 を表す。この建学の精神は創立者・額田晉の著書『自然・生命・人間』に由来（英語では\"NATURE LIFE MAN\"）。", "yomi": "とうほうだいがくいがくぶ", "cat": "P"}, {"name": "東京医科大学", "path": "P/P_tokyoidai.png", "origin": "校章は、東京医学専門学校時代より「醫」の旧漢字の裾を丸くした形。創学運動の学生会本部先輩の帽章に原型が 見られる。この独特の丸い形は弾丸を表現し、学生団が一丸となる意味が込められているとも言われる。 スクールカラーの臙脂色は、血署連判状の血判に最も近い色だからとも伝えられる。", "yomi": "とうきょういかだいがく", "cat": "P"}, {"name": "秋田大学医学部", "path": "N/N_Akita.png", "origin": "前身である秋田鉱山専門学校の校章に使われていた「ダイヤモンドの正八面体」をオマージュしたもので、 ダイヤモンドのブリリアントカットをモチーフに作成。磨き上げることでその輝きを最大限に引き出すダイヤモンド になぞらえ、教育と研究を通じて学生を育成し課題解決の知識とスキルを磨き上げる姿勢、多面的な美しさから 多様な視点を持つグローバルなリーダー育成の理念を象徴する。", "yomi": "あきただいがくいがくぶ", "cat": "N"}, {"name": "旭川医科大学", "path": "N/N_Asahikawa.png", "origin": "旭川医科大学のイニシャル「A」をストライプで図案化。右上がりに跳ねる様は、豊かな自然の旭川から医療人 及び研究者を育成し、地域に根ざした医療及び福祉のさらなる向上（発信）を表現。薄紫はラベンダーの景観や 医療の英知・国際貢献、緑は再生や生命の輝きを意味する。", "yomi": "あさひかわいかだいがく", "cat": "N"}, {"name": "千葉大学医学部", "path": "N/N_Chiba.png", "origin": "学章（八角形の赤いマーク）は昭和24年（1949年）10月、赤穴宏氏（元千葉大学名誉教授）がデザイン。 Chiba Daigakuの頭文字「C」「D」を組み合わせ、千葉大学の「千」を配して構成。輪郭は無限の生命力を象徴する 「植物の種子」をかたどっている。左側のガーネット（えんじ）色は情熱を、右側の白色は純粋を表現。長年 「シンボルマーク」として使われてきたが、2013年3月に正式に「学章」として制定された。", "yomi": "ちばだいがくいがくぶ", "cat": "N"}, {"name": "愛媛大学医学部", "path": "N/N_Ehime.png", "origin": "ブランドマークは、「地域とともに輝く大学」を目指す愛媛大学が「愛媛の知の拠点（ドット・エヒメ）」と なることを決意表明。左の円は太陽を、右の「e」は躍動する姿を、全体はすこやかに伸びていく新芽を表す。 愛媛みかんを連想させる黄色は明朗さ・快活さの象徴。ロゴタイプは、「愛媛」という画数の多い漢字を シンプルに見せるため、和文・欧文ともにシャープなフォルムで構成。", "yomi": "えひめだいがくいがくぶ", "cat": "N"}, {"name": "福井大学医学部", "path": "N/N_Fukui.png", "origin": "学章は、二つの円が結びつき無限大（インフィニティ）の形を形成したもの。それらの円は統合前の「福井大学と 福井医科大学」、また「科学と技術」を表し、無限大は新大学の可能性を表現している。中央の反転部には福井 大学の頭文字「f」を表出。色は「福井の美しい海と空」「若さと知性」を表す。2003年の旧福井大学・旧福井 医科大学統合を機に学内外から公募し、2004年10月制定。", "yomi": "ふくいだいがくいがくぶ", "cat": "N"}, {"name": "岐阜大学医学部", "path": "N/N_Gifu.png", "origin": "学章は、鵜舟と篝火を意味する。篝火は「学問」、舟は「人類の幸福」を象徴するとされる。また、陰陽2体の 組み合わせは天地自然、存在と活動の調和・バランスを表す。黒とオレンジは意志と情熱、感性の豊かさと品位を 表現する。さらに、学章は弓と組み合わさって「G」を形成している。", "yomi": "ぎふだいがくいがくぶ", "cat": "N"}, {"name": "群馬大学医学部", "path": "N/N_Gumma.png", "origin": "群馬大学の英頭文字「G」をモチーフに、緑と青で豊かな自然環境を表現。学生の成長・活躍、新しい未来の 創造、社会への貢献をイメージしている。", "yomi": "ぐんまだいがくいがくぶ", "cat": "N"}, {"name": "浜松医科大学", "path": "N/N_Hamamatsu.png", "origin": "本学のローマ字での頭文字「h」をデザイン化。水色部分が遠州灘（下部分の曲線）、浜名湖の水面、浜松から 望む富士山（右上の突起）で浜松の特色を、全体の曲線が生命の源である自然な水のゆらぎ、医療の重要 キーワード「生命」を表現。オレンジ色の丸と水色部分の両方を合わせて全体を見ると、元気・健康・躍動を 表現した人（丸を頭、水色の両端を手に見立てる）に見え、人類の健康と福祉に貢献することをイメージしている。", "yomi": "はままついかだいがく", "cat": "N"}, {"name": "広島大学医学部", "path": "N/N_Hiroshima.png", "origin": "学章は、清新な生命とフェニックスの葉を図案化したもの。学内公募で選ばれた工学部学生の作品に修正を加え、 1956年（昭和31年）に制定された。「フェニックス」は灰の中から再生するとされる不死鳥で、原爆によって 廃墟となった広島の地に新たに生まれた大学を、再生・新しい生命の象徴として不死鳥になぞらえたもの。 フェニックスという名前を持つヤシ科植物の葉も図案に採用されている。", "yomi": "ひろしまだいがくいがくぶ", "cat": "N"}, {"name": "北海道大学医学部", "path": "N/N_Hokkaido_alt.png", "origin": "シンボルマークは、キャンパス内に自生する「オオバナノエンレイソウ」（ユリ科トリリウム属の多年草）を 図案化したもの。1950年の公募による入選作をもとに、創基120周年を機に修正し、1996年（平成8年）に正式な シンボルマークとして決定された。花弁・がく片による六方向への広がりは、北海道大学から日本・世界へ向けて 情報を発信することを意味する。", "yomi": "ほっかいどうだいがくいがくぶ", "cat": "N"}, {"name": "東京医科歯科大学", "path": "N/N_Ikashika.png", "origin": "旧東京医科歯科大学の伝統的エンブレムは、ベンゼン環を思わせる六角形の連なりが「醫」の字を囲む意匠。", "yomi": "とうきょういかしかだいがく", "cat": "N"}, {"name": "香川大学医学部", "path": "N/N_Kagawa.png", "origin": "シンボルマークは、地球規模のグローバルな展開を示す形状を採用。スクールカラーは、香川県の温暖な風土と オリーブをイメージしたグリーン。", "yomi": "かがわだいがくいがくぶ", "cat": "N"}, {"name": "金沢大学医学部", "path": "N function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

const collator = new Intl.Collator('ja');
const SORTED_INDEX = DATA
  .map((d,i)=>i)
  .sort((a,b)=> collator.compare(DATA[a].yomi || DATA[a].name, DATA[b].yomi || DATA[b].name));

function poolForCat(cat){
  if(cat === "ALL") return SORTED_INDEX.slice();
  return SORTED_INDEX.filter(i => DATA[i].cat === cat);
}

/* ---------- CATEGORY TABS + SLIDER ---------- */
function renderCatTabs(){
  els.catTabs.innerHTML = '';
  CAT_ORDER.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat === selectedCat ? ' active' : '');
    btn.textContent = CAT_LABELS[cat];
    btn.addEventListener('click', ()=>{
      selectedCat = cat;
      renderCatTabs();
      updateCatCount();
    });
    els.catTabs.appendChild(btn);
  });
}
function updateCatCount(){
  const n = poolForCat(selectedCat).length;
  els.catCount.innerHTML = `<b>${n}</b> 校が対象です`;
  els.qCountSlider.max = n;
  if(parseInt(els.qCountSlider.value,10) > n){
    els.qCountSlider.value = n;
  }
  els.qCountVal.textContent = els.qCountSlider.value;
}
els.qCountSlider.addEventListener('input', ()=>{
  els.qCountVal.textContent = els.qCountSlider.value;
});
renderCatTabs();
updateCatCount();

/* ---------- QUIZ ---------- */
function startQuiz(){
  const pool = poolForCat(selectedCat);
  const n = Math.max(1, Math.min(parseInt(els.qCountSlider.value,10) || pool.length, pool.length));
  order = shuffle(pool).slice(0, n);
  current = 0;
  score = 0;
  showScreen('quiz');
  loadQuestion();
}

function renderChoices(filter){
  const f = (filter||'').trim();
  els.choiceList.innerHTML = '';
  const items = SORTED_INDEX
    .map(idx=>({name:DATA[idx].name, yomi:DATA[idx].yomi||'', idx}))
    .filter(d => !f || d.name.startsWith(f) || d.yomi.startsWith(f));
  if(items.length === 0){
    const empty = document.createElement('div');
    empty.className = 'choice-empty';
    empty.textContent = '該当する大学が見つかりません';
    els.choiceList.appendChild(empty);
    return;
  }
  items.forEach(item=>{
    const btn = document.createElement('button');
    btn.className = 'choice-item';
    btn.textContent = item.name;
    btn.addEventListener('click', ()=> selectAnswer(item.idx));
    els.choiceList.appendChild(btn);
  });
}

function loadQuestion(){
  answered = false;
  const qIdx = order[current];
  const q = DATA[qIdx];
  els.logoImg.src = q.img;
  els.logoImg.alt = 'ロゴクイズ';
  els.progText.textContent = `問題 ${current+1} / ${order.length}`;
  els.scoreText.textContent = `正解 ${score}`;
  els.progFill.style.width = ((current)/order.length*100) + '%';
  els.answeringPane.style.display = '';
  els.feedbackPane.style.display = 'none';
  els.searchInput.value = '';
  renderChoices('');
}

function selectAnswer(chosenIdx){
  if(answered) return;
  answered = true;
  const correctIdx = order[current];
  const isCorrect = chosenIdx === correctIdx;
  if(isCorrect) score++;

  els.answeringPane.style.display = 'none';
  els.feedbackPane.style.display = 'flex';
  els.feedbackBadge.className = 'feedback-badge ' + (isCorrect ? 'correct' : 'wrong');
  els.feedbackBadge.textContent = isCorrect ? '○ 正解！' : '✕ 不正解';
  els.feedbackAnswer.textContent = DATA[correctIdx].name;
  if(!isCorrect){
    els.feedbackYourAnswer.style.display = '';
    els.feedbackYourAnswer.textContent = `あなたの回答：${DATA[chosenIdx].name}`;
  } else {
    els.feedbackYourAnswer.style.display = 'none';
  }
  els.originText.textContent = DATA[correctIdx].origin;
  els.scoreText.textContent = `正解 ${score}`;
  els.progFill.style.width = ((current+1)/order.length*100) + '%';
  els.nextBtn.textContent = (current+1 < order.length) ? '次の問題へ' : '結果を見る';
}

function nextQuestion(){
  current++;
  if(current >= order.length){
    finishQuiz();
  } else {
    loadQuestion();
  }
}

function finishQuiz(){
  showScreen('result');
  els.resultScore.innerHTML = `${score}<span>/${order.length}</span>`;
  const pct = score / order.length;
  let comment;
  if(pct === 1) comment = '全問正解。もう見分けられますね。';
  else if(pct >= 0.8) comment = 'かなりの正答率。ロゴ通と言っていいレベルです。';
  else if(pct >= 0.5) comment = '半分以上正解。見覚えのあるロゴが増えてきたのでは。';
  else if(pct >= 0.2) comment = 'まだ知らないロゴがたくさんありそうです。もう一度挑戦してみましょう。';
  else comment = '最初は誰でもこんなもの。由来を読みながらもう一周してみてください。';
  els.resultComment.textContent = comment;
}

/* ---------- STUDY ---------- */
function openStudy(){
  studyPool = poolForCat(selectedCat);
  els.studyTitle.textContent = `学習：${CAT_LABELS[selectedCat]}`;
  els.studySearch.value = '';
  showScreen('study');
  renderStudyGrid('');
}

function renderStudyGrid(filter){
  const f = (filter||'').trim();
  els.studyGrid.innerHTML = '';
  const items = studyPool
    .map(idx=>DATA[idx])
    .filter(d => !f || d.name.startsWith(f) || (d.yomi||'').startsWith(f));
  if(items.length === 0){
    const empty = document.createElement('div');
    empty.className = 'study-empty';
    empty.textContent = '該当する大学が見つかりません';
    els.studyGrid.appendChild(empty);
    return;
  }
  items.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'study-card';
    card.innerHTML = `<img src="${d.img}" alt=""><div class="sc-name">${d.name}</div>`;
    card.addEventListener('click', ()=> openModal(d));
    els.studyGrid.appendChild(card);
  });
}

function openModal(d){
  els.modalImg.src = d.img;
  els.modalName.textContent = d.name;
  els.modalCat.textContent = CAT_LABELS[d.cat] || '';
  els.modalOrigin.textContent = d.origin;
  els.modalOverlay.classList.add('active');
}
function closeModal(){
  els.modalOverlay.classList.remove('active');
}

/* ---------- HOME MOSAIC ---------- */
const MOSAIC_COLS = 5, MOSAIC_ROWS = 3, MOSAIC_COUNT = MOSAIC_COLS * MOSAIC_ROWS;
const mosaicGridEl = document.getElementById('mosaicGrid');
const mosaicCells = [];

function randDataIndex(){ return Math.floor(Math.random() * DATA.length); }
function randDir(){
  const dirs = [
    {x:'-100%', y:'0'}, {x:'100%', y:'0'},
    {x:'0', y:'-100%'}, {x:'0', y:'100%'}
  ];
  return dirs[Math.floor(Math.random()*dirs.length)];
}
function dirTransform(d){ return `translate(${d.x}, ${d.y})`; }

function renderCellContent(cs){
  cs.el.innerHTML = `<img src="${DATA[cs.idx].img}" alt="">`;
}

function buildMosaic(){
  mosaicGridEl.innerHTML = '';
  for(let i=0;i<MOSAIC_COUNT;i++){
    const cell = document.createElement('div');
    cell.className = 'mosaic-cell';
    const inner = document.createElement('div');
    inner.className = 'mosaic-inner is-logo';
    cell.appendChild(inner);
    mosaicGridEl.appendChild(cell);
    const cs = { el: inner, idx: randDataIndex(), animating:false };
    renderCellContent(cs);
    mosaicCells.push(cs);
  }
}
buildMosaic();

function animateCell(cs){
  cs.animating = true;
  const dOut = randDir();
  cs.el.style.transition = 'transform .6s cubic-bezier(.4,0,.2,1)';
  cs.el.style.transform = dirTransform(dOut);
  setTimeout(()=>{
    let next;
    do { next = randDataIndex(); } while(next === cs.idx);
    cs.idx = next;
    renderCellContent(cs);
    const dIn = randDir();
    cs.el.style.transition = 'none';
    cs.el.style.transform = dirTransform(dIn);
    void cs.el.offsetWidth;
    requestAnimationFrame(()=>{
      cs.el.style.transition = 'transform .6s cubic-bezier(.4,0,.2,1)';
      cs.el.style.transform = 'translate(0,0)';
    });
    setTimeout(()=>{ cs.animating = false; }, 620);
  }, 600);
}

setInterval(()=>{
  mosaicCells.forEach(cs=>{
    if(!cs.animating && Math.random() < 0.5) animateCell(cs);
  });
}, 2400);


els.headerHomeBtn.addEventListener('click', ()=> showScreen('home'));
els.startBtn.addEventListener('click', startQuiz);
els.studyBtn.addEventListener('click', openStudy);
els.studyBackBtn.addEventListener('click', ()=> showScreen('home'));
els.nextBtn.addEventListener('click', nextQuestion);
els.retryBtn.addEventListener('click', startQuiz);
els.homeBtn.addEventListener('click', ()=> showScreen('home'));
els.searchInput.addEventListener('input', (e)=> renderChoices(e.target.value));
els.studySearch.addEventListener('input', (e)=> renderStudyGrid(e.target.value));
els.modalClose.addEventListener('click', closeModal);
els.modalOverlay.addEventListener('click', (e)=>{ if(e.target === els.modalOverlay) closeModal(); });
</script>
